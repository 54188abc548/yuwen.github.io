<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人介绍</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        header {
            background: linear-gradient(90deg, #4b6cb7 0%, #182848 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        
        .profile-section {
            display: flex;
            flex-wrap: wrap;
            padding: 30px;
        }
        
        .avatar-container {
            flex: 0 0 200px;
            margin-right: 30px;
            margin-bottom: 20px;
        }
        
        .avatar {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #e0e0e0;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .info-container {
            flex: 1;
            min-width: 300px;
        }
        
        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
        }
        
        .title {
            color: #4b6cb7;
            font-size: 1.2rem;
            margin-bottom: 20px;
            font-weight: 500;
        }
        
        .intro {
            line-height: 1.6;
            color: #555;
            margin-bottom: 25px;
        }
        
        .skills {
            margin-top: 20px;
        }
        
        .skills h3 {
            margin-bottom: 10px;
            color: #333;
        }
        
        .skill-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .skill-tag {
            background: #eef2ff;
            color: #4b6cb7;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        
        .contact {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 20px;
        }
        
        .contact-item {
            display: flex;
            align-items: center;
            color: #555;
        }
        
        .contact-item i {
            margin-right: 8px;
            color: #4b6cb7;
        }
        
        footer {
            background: #f5f7fa;
            padding: 20px;
            text-align: center;
            color: #777;
            font-size: 0.9rem;
        }
        
        @media (max-width: 600px) {
            .profile-section {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            
            .avatar-container {
                margin-right: 0;
            }
            
            .contact {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>欢迎来到我的个人主页</h1>
            <p>探索我的故事与技能</p>
        </header>
        
        <section class="profile-section">
            <div class="avatar-container">
                <img src="image_download_1751762831049.jpg" alt="个人头像" class="avatar">
            </div>
            
            <div class="info-container">
                <h1>张三</h1>
                <p class="title">前端开发工程师 | 用户体验设计师</p>
                
                <p class="intro">
                    你好！我是一名充满热情的前端开发工程师，拥有5年以上的Web开发经验。
                    我热爱创造美观、易用的用户界面，并致力于通过技术改善用户体验。
                    我相信好的设计不仅仅是外观，更是功能与美学的完美结合。
                </p>
                
                <div class="skills">
                    <h3>技能专长</h3>
                    <div class="skill-tags">
                        <span class="skill-tag">HTML5/CSS3</span>
                        <span class="skill-tag">JavaScript</span>
                        <span class="skill-tag">React</span>
                        <span class="skill-tag">Vue.js</span>
                        <span class="skill-tag">响应式设计</span>
                        <span class="skill-tag">UI/UX设计</span>
                    </div>
                </div>
                
                <div class="contact">
                    <div class="contact-item">
                        <i>📧</i> <span>zhangsan@example.com</span>
                    </div>
                    <div class="contact-item">
                        <i>📱</i> <span>+86 138 0000 0000</span>
                    </div>
                    <div class="contact-item">
                        <i>📍</i> <span>北京市朝阳区</span>
                    </div>
                </div>
            </div>
        </section>
        
        <footer>
            <p>© 2023 张三的个人主页 | 感谢访问</p>
        </footer>
    </div>
</body>
  </html>
